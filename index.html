<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="icon" type="image/png" href="NetflixLogo.webp">
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;

            
        }
        body{
            background-image: url("netflix_background.png");
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }
        header img{
            height:100px;
            width:200px;
            margin-left: 30px;
            margin-top: 10px;
        }
        section{
            height:420px;
            width:400px;
            margin-top: 20px;
            margin-left:550px;
            background-color:rgba(14, 0, 0, 0.725);
            color: rgba(255, 255, 255, 0.651);
        }
        form{
            margin-left:70px;
            padding-top:30px;
        }
        form input[type="text"],
        form input[type="password"]{
            width: 250px;
            height: 30px;
            padding: 5px;
            background-color: rgb(63, 59, 59);
            border:none;
            border-radius:5px;
        }
        input::placeholder{
            padding: 10px;
        }
        form input[type="Submit"]{
            width: 260px;
            height:40px;
            padding: 10px;
            background-color: red;
            font-size:15px;
            border: none;
            border-radius:5px;
            color: white;
        }
        a{
            text-decoration: none;
            color: white;
        }

        #signup{
            color: white;
        }
        
    </style>
</head>
<body>
    <header>
        <img src="netflix logo.png" alt="netflix logo">
    </header>
   <section>
        <form>
            <h1>Sign In</h1><br>
            <input type="text" placeholder="Email or Phone No" name="uname"><br><br>
            <input type="password" placeholder="Password" name="upass"><br><br>
            <input type="Submit" value="Sign In" name="submit"><br><br>
            <input type="checkbox" checked>&nbsp;<label>Remember Me</label>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <a href="#">Needhelp?</a><br><br><br>
            <p>New to Netflix?<a href="#" id="signup" >Sign up now</a></p>&nbsp;&nbsp;
            <p style="font-size:12px;">This Page is protected by Google reCAPTCHA to<br> ensure you are not bot.<a href="#">Learn more</a></p>
        </form>
        
   </section>
</body>
</html>
